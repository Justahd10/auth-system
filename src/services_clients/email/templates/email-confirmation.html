<!DOCTYPE html>
<html>
  <head>
    <title>Confirmação de email</title>
    <style>
      /* Estilos gerais com seletores de elemento simples para melhor suporte */
      body {
        margin: 0;
        padding: 0;
        background-color: #F1F4F8;
        font-family: Calibri, Helvetica, Arial, sans-serif;
      }

      /* Estrutura central da tabela */
      .email-wrapper {
        width: 100%;
        border-collapse: collapse;
        background-color: #F1F4F8;
      }

      /* Cabeçalho */
      .header-cell {
        background-color: #052240;
        padding: 15px 0;
        text-align: center;
      }

      .logotype-table {
        margin: 0 auto;
        border-collapse: collapse;
      }

      .logotype-icon {
        width: 50px;
        height: 50px;
        background-color: #ffffff;
        border: 4px solid #ffffff;
        border-radius: 8px;
        vertical-align: middle;
      }

      .logotype-slogan {
        font-family: Calibri, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
        padding-left: 15px;
        vertical-align: middle;
      }

      /* Conteúdo principal */
      .content-cell {
        padding: 40px 20px 0 20px;
        text-align: center;
      }

      .title {
        font-family: Calibri, Helvetica, Arial, sans-serif;
        font-size: 24px;
        color: #000000;
        margin: 0 0 15px 0;
      }

      .confirmation-code {
        font-family: Calibri, Helvetica, Arial, sans-serif;
        font-size: 38px;
        letter-spacing: 8px;
        font-weight: bold;
        color: #052240;
        margin: 0 0 15px 0;
      }

      .message {
        font-family: Calibri, Helvetica, Arial, sans-serif;
        font-size: 18px;
        color: #333333;
        margin: 0 0 40px 0;
        text-align: center;
      }

      /* Ilustração do rodapé simulada via tabela de blocos (compatível com e-mail) */
      .illustration-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      .illustration-top-bar {
        background-color: #BFCAD9;
        height: 12px;
        line-height: 12px;
        font-size: 1px;
      }

      .illustration-bottom-bar {
        background-color: #1F4D92;
        height: 45px;
        line-height: 45px;
        font-size: 1px;
      }
    </style>
  </head>

  <body>
    <table class="email-wrapper" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td class="header-cell">
          <table class="logotype-table" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td class="logotype-slogan">
                Elephants eletrônicos
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td class="content-cell">
          <h1 class="title">Confirmação de email</h1>
          <p class="confirmation-code">{confirmCode}</p>
          <p class="message">
            Por favor, informe o código acima para cadastrarmos você em nossa loja
          </p>
        </td>
      </tr>
      <tr>
        <td>
          <table class="illustration-table" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td class="illustration-top-bar">&nbsp;</td>
            </tr>
            <tr>
              <td class="illustration-bottom-bar">&nbsp;</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
